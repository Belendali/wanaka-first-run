<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wanaka · First run in Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Bitcount+Grid+Single:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=3">
</head>
<body>
<div class="fit" id="fit">
  <div class="stage" id="stage">

    <!-- top bar · 1920×44 -->
    <header class="top">
      <span class="top__l">
        <button class="ib ib--home" title="Home"><svg viewBox="0 0 16 16"><path d="M2.5 7.2 8 2.5l5.5 4.7V13a.5.5 0 0 1-.5.5H10V9.5H6v4H3a.5.5 0 0 1-.5-.5z"/></svg></button>
        <i class="vr"></i>
        <button class="tab">Main <i class="dots">⋮</i></button>
      </span>
      <span class="top__c">
        <span class="tools">
          <button class="ib is-on" title="Select"><svg viewBox="0 0 16 16"><path d="M4 2.5 12 8l-3.6.9L6.6 12.5z"/></svg></button>
          <button class="ib" title="Pan"><svg viewBox="0 0 16 16"><path d="M5.5 7V3.8a1 1 0 0 1 2 0V7m0-.5V3a1 1 0 0 1 2 0v4m0-2.5a1 1 0 0 1 2 0V9a4 4 0 0 1-4 4h-.6A4 4 0 0 1 4 11L2.6 8.4a1 1 0 0 1 1.7-1L5.5 9"/></svg></button>
          <i class="vr"></i>
          <button class="ib" title="Move"><svg viewBox="0 0 16 16"><path d="M8 2v12M2 8h12M8 2 6.4 3.6M8 2l1.6 1.6M8 14l-1.6-1.6M8 14l1.6-1.6M2 8l1.6-1.6M2 8l1.6 1.6M14 8l-1.6-1.6M14 8l-1.6 1.6"/></svg></button>
          <button class="ib" title="Rotate"><svg viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5v2.4h-2.4"/></svg></button>
          <button class="ib is-on" title="Scale"><svg viewBox="0 0 16 16"><path d="M9.5 2.5h4v4M13.5 2.5 8.5 7.5M6.5 13.5h-4v-4M2.5 13.5l5-5"/></svg></button>
          <i class="vr"></i>
          <button class="ib" title="Add"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5"/><path d="M8 5.5v5M5.5 8h5"/></svg></button>
        </span>
        <span class="mode">
          <button class="mode__b is-on"><svg viewBox="0 0 16 16"><path d="M2.5 3.5h4v4h-4zM9.5 3.5h4v4h-4zM2.5 10h4v3h-4zM9.5 10h4v3h-4z"/></svg>Build</button>
          <button class="mode__b"><svg viewBox="0 0 16 16"><rect x="2" y="4" width="12" height="8" rx="3"/><path d="M5.5 7v2M4.5 8h2M10.5 7.5h.01M11.5 8.5h.01"/></svg>Preview</button>
        </span>
      </span>
      <span class="top__r">
        <button class="pill"><svg viewBox="0 0 16 16"><circle cx="6" cy="5.5" r="2.5"/><path d="M2 13c.5-2.5 2-3.5 4-3.5s3.5 1 4 3.5M11 3.5a2.2 2.2 0 0 1 0 4.2M12.5 9.8c1 .6 1.6 1.7 1.8 3.2"/></svg>Multiplayer</button>
        <button class="pill pill--pub"><svg viewBox="0 0 16 16"><path d="M9.5 2.5h4v4M13.5 2.5 7 9M11.5 9.5v3a1 1 0 0 1-1 1h-7a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1h3"/></svg>Publish</button>
        <i class="gap"></i>
        <button class="pill pill--up"><svg viewBox="0 0 16 16"><path d="M9 1.5 3.5 9h4L7 14.5 12.5 7h-4z"/></svg>Upgrade</button>
        <span class="coins"><i class="coin"></i>320</span>
        <button class="ib" title="History"><svg viewBox="0 0 16 16"><path d="M2.5 8a5.5 5.5 0 1 0 1.6-3.9M2.5 2.5v2.6h2.6M8 5v3l2 1.5"/></svg></button>
        <button class="ib" title="Undo"><svg viewBox="0 0 16 16"><path d="M5 4 2.5 6.5 5 9M2.5 6.5H10a3.5 3.5 0 0 1 0 7H8"/></svg></button>
        <button class="ib" title="Redo"><svg viewBox="0 0 16 16"><path d="M11 4l2.5 2.5L11 9M13.5 6.5H6a3.5 3.5 0 0 0 0 7h2"/></svg></button>
        <button class="ib" title="Save"><svg viewBox="0 0 16 16"><path d="M3 2.5h8l2.5 2.5v8.5H3zM5.5 2.5v3.5h5V2.5M5 13.5V9.5h6v4"/></svg></button>
      </span>
    </header>

    <!-- left rail · 48 wide -->
    <nav class="rail">
      <button class="rail__b"><i><svg viewBox="0 0 16 16"><path d="M8 1.8 13.5 5v6L8 14.2 2.5 11V5z"/><path d="M2.5 5 8 8.2 13.5 5M8 8.2v6"/></svg></i><span>Scene</span></button>
      <button class="rail__b"><i><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5"/><path d="M8 5.5v5M5.5 8h5"/></svg></i><span>Assets</span></button>
      <button class="rail__b"><i><svg viewBox="0 0 16 16"><path d="M8 2c.5 3 2.9 5.5 6 6-3.1.5-5.5 3-6 6-.5-3-2.9-5.5-6-6 3.1-.5 5.5-3 6-6z"/></svg></i><span>Create</span></button>
      <button class="rail__b"><i><svg viewBox="0 0 16 16"><path d="M8 2.5a5.5 5.5 0 1 0 0 11c1 0 1.2-.8.8-1.5-.5-.9 0-2 1.2-2h1.5a2 2 0 0 0 2-2A5.5 5.5 0 0 0 8 2.5z"/><circle cx="5.2" cy="7" r=".6"/><circle cx="7.5" cy="5" r=".6"/><circle cx="10.5" cy="5.6" r=".6"/></svg></i><span>Visual</span></button>
      <button class="rail__b"><i><svg viewBox="0 0 16 16"><path d="M8 1.8 13.5 5v6L8 14.2 2.5 11V5z"/><path d="M5.2 3.4l5.5 3.2v3"/></svg></i><span>Toolbox</span></button>
      <button class="rail__b"><i><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg></i><span>Settings</span></button>
      <span class="rail__me"><img src="assets/crew-planner.webp" alt=""></span>
    </nav>

    <!-- viewport · 1472×1024 -->
    <section class="view" id="view">
      <div class="view__sky"></div>
      <div class="view__floor"><div class="view__grid"></div></div>
      <div class="gizmo" aria-hidden="true">
        <i class="gz gz--z">Z</i><i class="gz gz--y">Y</i><i class="gz gz--x">X</i>
        <i class="gz gz--o gz--o1"></i><i class="gz gz--o gz--o2"></i><i class="gz gz--o gz--o3"></i>
        <svg viewBox="0 0 96 96"><path d="M48 48V14M48 48l26-10M48 48l14 22" /></svg>
      </div>
    </section>

    <!-- chat · 400 wide -->
    <aside class="chat" id="chat">
      <div class="chat__glow"></div>
      <header class="chat__h">
        <button class="chat__name"><span id="chatName">New chat</span><svg viewBox="0 0 16 16"><path d="m4 6 4 4 4-4"/></svg></button>
        <button class="chat__plus"><svg viewBox="0 0 16 16"><path d="M8 3.5v9M3.5 8h9"/></svg></button>
      </header>
      <div class="thread" id="thread"></div>
      <div class="dock">
        <div class="dock__cap">
          <img class="dock__cat" src="assets/crew-planner.webp" alt="">
          <span class="dock__model" id="model">Wanaka 1.0 Lite</span><i class="dock__dot"></i>
        </div>
        <div class="composer" id="composer">
          <div class="composer__in" id="input" data-ph="Ask, plan, build anything..."></div>
          <div class="composer__row">
            <button class="cbtn" title="Add"><svg viewBox="0 0 20 20"><path d="M10 4v12M4 10h12"/></svg></button>
            <button class="cbtn" title="Cut"><svg viewBox="0 0 20 20"><circle cx="6" cy="14" r="2.5"/><circle cx="14" cy="14" r="2.5"/><path d="M7.8 12.2 15 4M12.2 12.2 5 4"/></svg></button>
            <label class="plan" id="planTog"><span>Plan</span><i class="sw"><i></i></i></label>
            <i class="gap"></i>
            <button class="send" id="send" title="Send"><svg viewBox="0 0 20 20"><path d="M10 15V5M5.5 9.5 10 5l4.5 4.5"/></svg></button>
          </div>
        </div>
      </div>
    </aside>

    <!-- first-run tour layer -->
    <div class="tour" id="tour" hidden></div>

    <!-- full-cover plan -->
    <div class="planx" id="planx" hidden></div>
  </div>
</div>

<div class="director" id="director"></div>

<script src="app.js?v=2"></script>
</body>
</html>

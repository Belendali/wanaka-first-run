<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wanaka · First run in Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Bitcount+Grid+Single:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=11">
</head>
<body>
<div class="fit">
  <div class="stage" id="stage">

    <!-- the studio: shell, viewport and chat are the Figma frames themselves -->
    <div class="studio" id="studio">
      <img class="shell" src="assets/shell.png" alt="">
      <section class="view"><img src="assets/view-bg.jpg" alt=""></section>
      <aside class="chat" id="chat">
        <img class="chat__bg" src="assets/chat-bg.png" alt="">
        <div class="thread" id="thread"></div>
        <div class="composer" id="composer">
          <div class="composer__in" id="input" data-ph="Ask, plan, build anything..."></div>
          <div class="composer__row">
            <button class="cbtn" title="Add"><svg viewBox="0 0 20 20"><path d="M10 4v12M4 10h12"/></svg></button>
            <button class="cbtn" title="Cut"><svg viewBox="0 0 20 20"><circle cx="6" cy="14" r="2.5"/><circle cx="14" cy="14" r="2.5"/><path d="M7.8 12.2 15 4M12.2 12.2 5 4"/></svg></button>
            <button class="model">Wanaka 1.0 Max<svg viewBox="0 0 16 16"><path d="m4.5 6.5 3.5 3.5 3.5-3.5"/></svg></button>
            <i class="gap"></i>
            <button class="planpill" id="planPill">Plan</button>
            <button class="send" id="send" title="Send"><svg viewBox="0 0 20 20"><path d="M10 15V5M5.5 9.5 10 5l4.5 4.5"/></svg></button>
          </div>
        </div>
      </aside>
      <!-- the crew at work, over the scene -->
      <div class="crewbar" id="crewbar" hidden></div>
    </div>

    <!-- landing + login: the Figma frames, with the buttons live -->
    <div class="web" id="web" hidden>
      <img id="webImg" src="assets/landing.jpg" alt="">
      <button class="hot" id="hotCreate" style="left:1206px;top:817px;width:78px;height:32px" title="Create"></button>
      <button class="hot" id="hotGoogle" style="left:776px;top:548px;width:366px;height:40px" title="Continue with Google" hidden></button>
    </div>

    <div class="tour" id="tour" hidden></div>
    <div class="planx" id="planx" hidden></div>
  </div>
</div>

<div class="director" id="director"></div>

<script src="app.js?v=11"></script>
</body>
</html>
